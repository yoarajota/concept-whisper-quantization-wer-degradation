# ISO/IEC 25010 utility tree + ISO/IEC 5055 gates + diffusion assessment.
# Rubrics: framework/instruments/{iso25010,iso5055,diffusion}.md

# At most 3. A concept that drives all nine drives none.
driving_characteristics:
  - performance-efficiency
  - reliability

utility_tree:
  - id: S-001
    characteristic: performance-efficiency
    sub_attribute: time-behaviour
    scenario: >
      When the pipeline measures WER for 4 quantization levels on all 2620 LibriSpeech
      test-clean utterances, it completes end-to-end within 4 hours on a 4-core CPU,
      measured as wall-clock time reported by the CLI.
    priority: high
    difficulty: high
    verification: bench/wer_bench_test.go
    status: pass
    evidence_refs: [E-004]

  - id: S-002
    characteristic: reliability
    sub_attribute: fault-tolerance
    scenario: >
      When whisper-cli returns a non-zero exit code on 5% of samples, the pipeline
      skips those samples, logs each error, and reports at least 95% of samples
      successfully transcribed, measured as NumSuccess / total samples.
    priority: high
    difficulty: medium
    verification: internal/fault_test.go
    status: pass
    evidence_refs: [E-002, E-004]

  - id: S-003
    characteristic: maintainability
    sub_attribute: modifiability
    scenario: >
      When a new quantization level must be added, a developer touches at most
      2 files (cmd/werpipe/main.go for the level map, and the model download
      script), measured as files changed in the reference patch.
    priority: medium
    difficulty: medium
    verification: docs/04-tradeoffs.md
    status: unverified
    evidence_refs: []

iso5055:
  # One command that runs every check below and exits non-zero on violation.
  runner: "make quality"
  last_run:
    date: "2026-08-11"
    exit_code: 0
    commit: 2fdf7acca7ef226bfd4c6ef7e8119b8ce7baff0a
  thresholds:
    cyclomatic_complexity_max: 15
    function_length_max: 60
    file_length_max: 500
    duplicated_lines_pct_max: 3
    max_call_depth: 8
  # Replace `tool` with the real check for this stack. Rows may not be dropped.
  weaknesses:
    - {cwe: 798,  name: "Hard-coded credentials",              tool: "gitleaks"}
    - {cwe: 20,   name: "Improper input validation",           tool: "golangci-lint (govet)"}
    - {cwe: 476,  name: "Null pointer dereference",            tool: "golangci-lint (nilness)"}
    - {cwe: 772,  name: "Missing release of resource",         tool: "golangci-lint (bodyclose)"}
    - {cwe: 391,  name: "Unchecked error condition",           tool: "errcheck"}
    - {cwe: 400,  name: "Uncontrolled resource consumption",   tool: "golangci-lint (contextcheck)"}
    - {cwe: 1121, name: "Excessive cyclomatic complexity",     tool: "gocyclo"}
    - {cwe: 1041, name: "Unstructured duplicated code",        tool: "golangci-lint (dupl)"}
    - {cwe: 561,  name: "Dead code",                           tool: "staticcheck"}
    - {cwe: 1047, name: "Circular dependencies",               tool: "golangci-lint (depguard)"}
  exemptions:
    - id: X-001
      rule: cyclomatic_complexity_max
      scope: poc/stats.go:wilcoxon
      reason: "PoC code kept as evidence of P2; refactored version in src/werpipe/stats.go"
      expires: "2027-01-01"
    - id: X-002
      rule: cyclomatic_complexity_max
      scope: poc/stats.go:exactWilcoxonP
      reason: "Exhaustive recursion for n <= 20; decomposition would obscure the mathematical structure"
      expires: "2027-01-01"

# Rule R5: every structural complexity traced to the scenario that requires it.
complexity_ledger:
  - item: "Pipeline struct (exec wrapper for whisper.cpp)"
    justifies: [S-001]
    adr: D-001
  - item: "Docker container for whisper.cpp"
    justifies: [S-001]
    adr: D-001

