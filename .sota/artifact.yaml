# Curated narrative for the concept artifact (docs/artifact/data.json).
# Written at P6. Status: partially-supported — H-001 partial, H-002 supported.

pitch:
  one_line_answer: "The first statistically significant accuracy loss appears at INT4: +4.9% word error rate on clean speech (p=0.001) for a 71% smaller model — while INT8 and INT5 are slightly better than full precision."
  elevator: "The received wisdom: quantizing Whisper below full precision hurts transcription accuracy, so pick the highest bit-width you can afford. This project measured the actual degradation curve on the LibriSpeech clean-speech corpus with a statistical test built to catch a real difference, not just eyeball one. It took all 2620 utterances to see the truth: a 100-sample run found nothing, the full dataset found everything. INT8 and INT5 slightly improve accuracy (-1.9% and -3.0% word error rate). The first real degradation appears at INT4 — and it is half the size everyone predicted: +4.9% for a 71% smaller model."

headline:
  - text: "INT4 (4-bit): word error rate 5.61% vs 5.35% at full precision (+4.9% relative, p=0.001) — the first statistically significant degradation, at half the predicted magnitude"
    evidence: "E-006"
  - text: "INT8 (8-bit): 5.25% vs 5.35% (-1.9%, p=0.048) — no degradation; a small statistically significant improvement"
    evidence: "E-006"
  - text: "INT5 (5-bit): 5.19% vs 5.35% (-3.0%, p=0.001) — the best measured level on this corpus"
    evidence: "E-006"
  - text: "Model size: 2892MB (full precision) → 1543MB (INT8) → 1010MB (INT5) → 830MB (INT4, -71%)"
    evidence: "E-006"
  - text: "A 100-sample run detected none of this: the full 2620-sample dataset was required for the statistical test to see effects this small"
    evidence: "E-006"

reproduce:
  - "make docker-build"
  - "sh bench/overnight.sh   # resumable chunked benchmark (also works on a free Colab GPU: bench/colab.py)"

journey:
  - phase: "Theory"
    title: "Two hypotheses, one pipeline"
    summary: "The literature gave the falsifier a shape: INT4 degradation would have to be both statistically significant and exceed 10% relative word-error-rate increase to matter; INT8 was expected to be near-lossless. Two hypotheses fixed both sides of the curve before any measurement existed."
  - phase: "Proof of concept"
    title: "The pipeline was verified before it was trusted"
    summary: "The transcription-to-word-error-rate-to-statistical-test pipeline was proven end-to-end on a small model first (E-004), so a surprising result could not be blamed on broken machinery."
  - phase: "First measurement"
    title: "100 samples said nothing"
    summary: "A 100-sample run across all four quantization levels found no statistically significant difference anywhere: INT4 at +4.2% looked like noise (p=0.57 — a gap this small would show up by chance more than half the time). The honest reading was 'we cannot detect degradation', not 'there is none'."
  - phase: "Full dataset"
    title: "2620 samples found what 100 could not"
    summary: "Running the entire corpus turned every ambiguity into a result. INT8 and INT5 came out slightly better than full precision (-1.9% and -3.0%, both statistically significant) — mild quantization acting as a regularizer, exactly as the literature hinted. INT4 came out significantly worse: +4.9%, p=0.001. The cliff exists, it just sits at 4 bits and is half as tall as predicted."

lessons:
  - "Sample size decides which questions you get to ask. At 100 samples the answer was 'no significant degradation anywhere'; at 2620 the answer was a clean frontier: INT4. When a null result has practical consequences, treat the sample size as part of the claim — 'no detectable effect' and 'no effect' are different statements."
  - "Verifying the pipeline on a small model before the expensive large-v3 run separated machinery errors from surprising results — the surprising final numbers would have been far less credible otherwise."
  - "Predicting the direction of an effect is easier than predicting its size. The INT4 degradation arrived exactly where expected, at one half the predicted magnitude — which is still useful, because the practical question was always 'how much does 71% compression cost'."

limitations:
  baseline_wins: "Full precision remains the accuracy reference in the strict sense, but on this corpus INT8 and INT5 beat it with statistical significance. The honest framing flipped: for clean speech, quantization down to 5 bits is not a sacrifice — it is a slightly better model in a much smaller file."
  untested: "Clean speech only; the noisy half of the corpus (test-other) was not run, and the literature predicts degradation appears earlier and larger there. Non-English corpora untested. One corrupted 200-sample chunk was re-run in a different session and environment."
  next_level: "The single most valuable next measurement is the same paired test on noisy speech, where the INT4 penalty is expected to grow — that is a new dataset, not more of this one. A 2-bit level (Q2_K) would also extend the curve downward."
  structural: "The quantization schemes tested are those of the whisper.cpp runtime (Q8_0, Q5_0, Q4_0), not every INT variant; results do not transfer to other runtimes. The 95% confidence interval for INT4 — the range that very likely contains the true value — is [5.21%, 6.03%], so the +4.9% penalty holds only within that band."

audience:
  who_is_this_for: "Engineers choosing a whisper.cpp quantization level for memory-constrained deployments on clean speech — this is the measured trade-off table between size and accuracy they currently have to guess at."
  not_for: "Anyone deploying on noisy or multilingual audio, where these numbers do not apply — this page says so explicitly rather than letting the clean-speech result overgeneralise."
