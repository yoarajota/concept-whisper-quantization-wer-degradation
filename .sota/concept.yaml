id: C-003
slug: whisper-quantization-wer-degradation
title: "Whisper quantization WER degradation curve"
archetype: implementation
phase: P6
status: partially-supported

# The stack is declared explicitly so gate commands and verification paths are concrete
# rather than assumed. Any language is valid.
stack:
  language: Go
  build_tool: make
  test_runner: go test
  quality_runner: "make quality"   # must match quality-gates.yaml -> iso5055.runner

summary: >
  Measures the Word Error Rate of Whisper large-v3 across whisper.cpp integer quantization
  levels (FP16, INT8, INT5, INT4) on LibriSpeech test-clean to pinpoint the first
  quantization step that produces a statistically significant degradation.

question: "What INT quantization level produces the first statistically significant WER degradation in Whisper vs FP16 on clean speech?"

domain:
  - speech-processing
  - model-compression

# P0 selection screen. Every field must survive the question "is this a tautology?".
screen:
  problem_class: >
    Measuring how integer quantization degrades automatic speech recognition accuracy,
    identifying the smallest bit-width at which the WER penalty becomes both statistically
    significant and practically unacceptable.
  incumbent: >
    Whisper large-v3 FP16 inference via whisper.cpp — the reference precision used in
    production deployments. It falls short in memory-constrained environments (edge devices,
    mobile) where the full 16-bit model exceeds available RAM.
  falsifier: >
    If INT4 shows no statistically significant WER degradation vs FP16 on LibriSpeech
    test-clean (paired per-sample WER, Wilcoxon signed-rank test, p > 0.05).
  complexity_justification: >
    The question requires a pipeline that runs whisper.cpp at each quantization level,
    computes WER against ground-truth transcripts across all test-clean samples, and
    applies a statistical test. This is the minimum machinery that produces the numbers;
    nothing simpler answers the question.

baseline:
  name: Whisper large-v3 FP16 (whisper.cpp)
  version: whisper.cpp 1.7.x
  url: https://github.com/ggerganov/whisper.cpp
  why: >
    FP16 is the default precision for whisper.cpp and the reference accuracy point
    from the Whisper paper. Every quantization level below it is a deliberate trade-off.
  interesting_margin: >
    INT8 < 5% relative WER degradation is the accepted practical floor. INT4 crossing
    10% relative WER degradation would quantify the frontier where quantization costs
    more accuracy than it saves memory.

hypotheses:
  - id: H-001
    statement: >
      Under LibriSpeech test-clean conditions, INT4-quantized Whisper large-v3 shows
      statistically significant WER degradation (p <= 0.05, Wilcoxon signed-rank) and
      >10% relative WER increase vs FP16 baseline.
    verdict: partially-supported
    evidence_refs: [E-004, E-005, E-006]
    revisions:
      - date: "2026-08-11"
        reason: >
          Pipeline verified end-to-end with tiny.en (E-004).
      - date: "2026-08-11"
        reason: >
          Benchmark on 100 random samples (E-005): Q4_0 +4.2% rel, p=0.57 — no
          significant degradation detectable at n=100.
      - date: "2026-08-15"
        reason: >
          Full dataset (E-006): Q4_0 WER=5.61% vs F16 5.35%, +4.9% rel, p=0.0014 —
          statistically significant. Boundary: the significance condition held, but
          the magnitude is below the predicted 10% — quantization degrades INT4 by
          ~5% relative, not >10%. INT4 is the first level with significant degradation.

  - id: H-002
    statement: >
      Under LibriSpeech test-clean conditions, INT8-quantized Whisper large-v3 shows
      no statistically significant WER degradation vs FP16 (p > 0.05, Wilcoxon
      signed-rank), with relative WER increase < 5%.
    verdict: supported
    evidence_refs: [E-004, E-005, E-006]
    revisions:
      - date: "2026-08-11"
        reason: >
          Pipeline verified end-to-end with tiny.en (E-004).
      - date: "2026-08-11"
        reason: >
          100-sample benchmark (E-005): Q8_0 WER=4.73% vs F16 4.94% (-4.2% rel,
          p=0.38). Near-lossless on large-v3 clean speech.
      - date: "2026-08-15"
        reason: >
          Full dataset (E-006): Q8_0 WER=5.25% vs F16 5.35% (−1.9% rel, p=0.048).
          No degradation — a small statistically significant IMPROVEMENT,
          consistent with the literature's mild-quantization regularization effect.

